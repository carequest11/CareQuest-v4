<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Started — CareQuest</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth-header.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@^2.49.4/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<style>
:root{
  --paper:#FBF5E9;
  --paper-deep:#F3E9D4;
  --ink:#232B36;
  --ink-soft:#4B5563;
  --teal:#2F6B62;
  --teal-deep:#204A44;
  --rust:#B0492E;
  --gold:#C99A44;
  --line:#DCCBA6;
  --radius:14px;
  --max:1400px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:18px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;}
h1,h2,h3{
  font-family:'Fraunces',serif;
  font-weight:600;
  line-height:1.15;
  margin:0;
  color:var(--ink);
}
.wrap{max-width:var(--max);margin:0 auto;padding:0 28px;}
button, .btn{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:17px;
  cursor:pointer;
  border:none;
  border-radius:999px;
  padding:14px 28px;
  min-height:48px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-decoration:none;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
}
button:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:3px;
}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-deep); transform:translateY(-2px);}
.btn-outline{background:transparent;color:var(--teal);border:2px solid var(--teal);}
.btn-outline:hover{background:var(--teal);color:#fff; transform:translateY(-2px);}
.btn-rust{background:var(--rust);color:#fff;}
.btn-rust:hover{background:#8f3a24; transform:translateY(-2px);}
.btn-lg{font-size:20px; padding:20px 36px; min-height:64px; border-radius:16px;}

/* ===== HEADER (shared, compact) ===== */
header.site{
  border-bottom:1px solid var(--line);
  background:rgba(251,245,233,.92);
}
.nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 0;
}
.logo{
  display:flex; align-items:center; gap:10px;
  font-family:'Fraunces',serif; font-weight:600; font-size:22px;
  text-decoration:none;
}
.logo-mark{
  width:38px;height:38px;object-fit:contain;flex-shrink:0;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.08));
}
.navlinks{display:flex;align-items:center;gap:28px;font-weight:600;font-size:16px;}
.navlinks a{text-decoration:none;color:var(--ink-soft);}
.navlinks a:hover{color:var(--teal);}
.navlinks a.nav-login{
  color:var(--teal); border:1.5px solid var(--teal); border-radius:999px;
  padding:8px 18px;
}
.navlinks a.nav-login:hover{background:var(--teal); color:#fff;}
.back-link{
  display:inline-flex; align-items:center; gap:6px;
  font-weight:600; color:var(--ink-soft); text-decoration:none; font-size:15px;
}
.back-link:hover{color:var(--teal);}
.header-actions{display:flex;align-items:center;gap:18px;}
.login-link{
  display:inline-flex; align-items:center; gap:6px;
  font-weight:700; color:var(--teal); text-decoration:none; font-size:15px;
  border:1.5px solid var(--teal); border-radius:999px; padding:8px 18px;
}
.login-link:hover{background:var(--teal); color:#fff;}
@media (max-width:780px){ .navlinks{display:none;} }

/* ===================================================
   INDEX / SINGLE-VIEW HOME PAGE
=================================================== */
html.home-lock, body.home-lock{
  height:100%;
  overflow:hidden;
}
.home-screen{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
}
.home-hero{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 28px;
  position:relative;
}
.home-hero-inner{
  max-width:760px;
  text-align:center;
  position:relative;
  z-index:2;
}
.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  font-size:13px; color:var(--rust); margin-bottom:clamp(10px,2vh,18px);
}
.home-hero h1{
  font-size:clamp(28px,4.2vw,52px);
  font-weight:600;
}
.home-hero h1 em{font-style:italic; color:var(--teal);}
.home-hero p.lead{
  font-size:clamp(15px,1.6vw,19px);
  color:var(--ink-soft);
  max-width:52ch;
  margin:clamp(12px,2vh,22px) auto clamp(20px,3vh,32px);
}
.home-ctas{display:flex; gap:16px; flex-wrap:wrap; justify-content:center;}
.home-postmark{
  position:absolute; opacity:.5;
}
@media (max-height:700px){
  .home-hero p.lead{margin:10px auto 18px;}
  .btn-lg{padding:14px 26px; min-height:52px; font-size:17px;}
}

/* ---- pinned polaroid photos with tape, home page ---- */
.polaroid{
  position:absolute;
  width:220px;
  background:#fffdf8;
  padding:12px 12px 38px;
  box-shadow:0 14px 26px rgba(35,43,54,.16), 0 2px 5px rgba(35,43,54,.10);
  z-index:1;
}
.polaroid img{
  display:block; width:100%; height:152px; object-fit:cover;
  filter:sepia(.08) saturate(1.05) contrast(1.02);
}
.polaroid .cap{
  font-family:'Fraunces',serif; font-style:italic; font-size:13.5px;
  text-align:center; margin-top:10px; color:var(--ink-soft);
}
.tape{
  position:absolute; width:74px; height:27px;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.35) 0 3px, rgba(255,255,255,.05) 3px 6px),
    var(--gold);
  opacity:.72;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
  clip-path:polygon(0% 22%,4% 4%,9% 20%,15% 2%,22% 18%,29% 3%,36% 20%,43% 4%,50% 18%,57% 2%,64% 20%,71% 4%,78% 18%,85% 2%,92% 20%,97% 6%,100% 22%,100% 78%,95% 96%,90% 80%,83% 98%,76% 82%,69% 97%,62% 80%,55% 98%,48% 82%,41% 97%,34% 80%,27% 98%,20% 82%,13% 97%,6% 80%,0% 78%);
}
.pin-1{top:9%; left:5%; transform:rotate(-9deg);}
.pin-1 .tape{top:-13px; left:50%; transform:translateX(-50%) rotate(-4deg);}
.pin-2{top:12%; right:5.5%; transform:rotate(7deg);}
.pin-2 .tape{top:-12px; left:50%; transform:translateX(-50%) rotate(6deg);}
.pin-3{bottom:7%; left:6.5%; transform:rotate(6deg);}
.pin-3 .tape{top:-12px; left:50%; transform:translateX(-50%) rotate(-5deg);}
.pin-4{bottom:8%; right:6%; transform:rotate(-7deg);}
.pin-4 .tape{top:-12px; left:50%; transform:translateX(-50%) rotate(4deg);}

@media (max-width:1100px){
  .polaroid{width:180px; padding:10px 10px 32px;}
  .polaroid img{height:124px;}
}
@media (max-width:860px){
  .pin-2, .pin-3{display:none;}
  .polaroid{width:155px; padding:9px 9px 28px; opacity:.9;}
  .polaroid img{height:106px;}
  .pin-1{top:6%; left:3%;}
  .pin-4{bottom:5%; right:3%;}
}
@media (max-width:600px){
  .pin-1, .pin-4{display:none;}
}

/* ===================================================
   GET STARTED — CHOICE PAGE
=================================================== */
.choice-screen{
  min-height:calc(100vh - 68px);
  display:flex; align-items:center; justify-content:center;
  padding:40px 28px;
}
.choice-inner{max-width:820px; width:100%; text-align:center;}
.choice-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:40px;
}
.choice-card{
  background:#fff; border:1px solid var(--line); border-radius:20px;
  padding:44px 32px; text-decoration:none; color:var(--ink);
  display:flex; flex-direction:column; align-items:center; gap:16px;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.choice-card:hover{
  transform:translateY(-4px);
  box-shadow:0 16px 32px rgba(35,43,54,.1);
  border-color:var(--teal);
}
.choice-icon{
  width:76px;height:76px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper-deep);
}
.choice-card h3{font-size:24px;}
.choice-card p{color:var(--ink-soft); font-size:16px; margin:0;}
@media (max-width:700px){ .choice-grid{grid-template-columns:1fr;} }

/* ===================================================
   STEP INDICATOR (shared — account -> booking)
=================================================== */
.steps{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:32px; flex-wrap:wrap;
}
.step-pill{
  display:flex; align-items:center; gap:8px;
  font-size:14px; font-weight:600; color:var(--ink-soft);
  padding:8px 16px; border-radius:999px; border:1.5px solid var(--line);
  background:#fff;
}
.step-pill .num{
  width:20px;height:20px;border-radius:50%;
  background:var(--line); color:#fff; font-size:12px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.step-pill.done{border-color:var(--teal); color:var(--teal);}
.step-pill.done .num{background:var(--teal);}
.step-pill.active{border-color:var(--rust); color:var(--rust); background:#fff;}
.step-pill.active .num{background:var(--rust);}
.step-connector{width:28px; height:2px; background:var(--line);}
.steps-dark .step-pill{background:rgba(255,255,255,.04); color:#C9BFA3; border-color:rgba(255,255,255,.15);}
.steps-dark .step-pill.done{border-color:var(--teal); color:#fff;}
.steps-dark .step-pill.active{border-color:var(--gold); color:var(--gold);}
.steps-dark .step-connector{background:rgba(255,255,255,.15);}

/* ===================================================
   ACCOUNT / SIGN-UP FORMS — SHARED ACCESSIBLE SYSTEM
   (used by youth account, youth interview, and senior
   account so every form looks and behaves the same way)
=================================================== */
.youth-page, .senior-page{background:var(--paper);}

.acct-shell{max-width:680px; margin:0 auto; padding:40px 28px 72px;}
.acct-head{text-align:center; margin-bottom:32px;}
.acct-head h1{font-size:clamp(25px,3.2vw,34px);}
.acct-head p{color:var(--ink-soft); font-size:18px; margin-top:12px;}

.acct-card{
  background:#fff; border:1px solid var(--line); border-radius:20px; padding:40px;
}
.acct-card h2{
  font-family:'Inter'; font-weight:700; font-size:15px; letter-spacing:.04em;
  text-transform:uppercase; color:var(--ink-soft); margin-bottom:22px;
}

.field{margin-bottom:24px;}
.field label{display:block; font-size:18px; font-weight:600; margin-bottom:8px; color:var(--ink);}
.field input, .field select, .field textarea{
  width:100%; padding:15px 17px; border-radius:12px; border:2px solid var(--line);
  background:#fff; color:var(--ink); font-family:'Inter'; font-size:17px;
}
.field input::placeholder, .field textarea::placeholder{color:#9AA0A8;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--teal);}
.field textarea{resize:vertical; min-height:100px; line-height:1.5;}
.field-hint{display:block; font-weight:400; opacity:.65; font-size:15px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:600px){ .field-row{grid-template-columns:1fr;} }

/* interview / availability day + slot pickers, recoloured to match */
.day-tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.day-tab{
  padding:10px 16px; border-radius:10px; border:2px solid var(--line);
  background:var(--paper-deep); color:var(--ink); font-size:14px; font-weight:600; cursor:pointer;
}
.day-tab.active{background:var(--teal); border-color:var(--teal); color:#fff;}
.slot-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.slot{
  padding:14px 10px; border-radius:10px; border:2px solid var(--line);
  background:var(--paper-deep); color:var(--ink); font-size:15px; font-weight:600; text-align:center; cursor:pointer;
}
.slot.selected{background:var(--rust); border-color:var(--rust); color:#fff;}
.slot.disabled{opacity:.35; cursor:not-allowed;}

.acct-submit-row{
  margin-top:28px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.acct-submit-row p{font-size:14px; color:var(--ink-soft); margin:0;}
.acct-switch{
  text-align:center; margin-top:20px; font-size:15px; color:var(--ink-soft);
}
.acct-switch a{color:var(--teal); font-weight:700; text-decoration:none;}
.acct-switch a:hover{text-decoration:underline;}
.acct-submit{width:100%; margin-top:8px;}

/* ===================================================
   LOGIN PAGE — LARGE / HIGH-CONTRAST / ACCESSIBLE
=================================================== */
.login-shell{max-width:520px; margin:0 auto; padding:56px 28px 80px;}
.login-head{text-align:center; margin-bottom:32px;}
.login-head h1{font-size:clamp(26px,3.4vw,36px);}
.login-head p{color:var(--ink-soft); font-size:18px; margin-top:12px;}
.login-card{
  background:#fff; border:1px solid var(--line); border-radius:20px; padding:40px;
}
.login-role-row{display:flex; gap:12px; margin-top:22px;}
.login-role-row .btn{flex:1;}
.login-divider{
  display:flex; align-items:center; gap:14px; margin:26px 0;
  color:var(--ink-soft); font-size:14px; font-weight:600;
}
.login-divider::before, .login-divider::after{content:"";flex:1;height:1px;background:var(--line);}
.login-help{
  text-align:center; margin-top:24px; font-size:16px; color:var(--ink-soft);
}
.login-help a{color:var(--teal); font-weight:700; text-decoration:none;}
.login-help a:hover{text-decoration:underline;}

/* ===================================================
   ABOUT / HOW IT WORKS PAGE
=================================================== */
section.about-section{padding:80px 0;}
.section-head{max-width:640px; margin:0 auto 56px; text-align:center;}
.section-head .eyebrow{justify-content:center;}
.section-head h2{font-size:clamp(28px,3.4vw,38px);}
.section-head p{color:var(--ink-soft); font-size:18px; margin-top:14px;}

.about-hero{padding:64px 0 24px; text-align:center;}
.about-hero h1{font-size:clamp(30px,4vw,46px);}
.about-hero p{color:var(--ink-soft); max-width:60ch; margin:18px auto 0; font-size:19px;}

.route{position:relative;}
.route-line{
  position:absolute; top:46px; left:6%; right:6%;
  height:2px;
  background-image:linear-gradient(to right, var(--rust) 0 10px, transparent 10px 20px);
  background-size:20px 2px;
  background-repeat:repeat-x;
  z-index:0;
}
.route-steps{
  display:grid; grid-template-columns:repeat(4,1fr); gap:24px; position:relative; z-index:1;
}
.step{text-align:center;}
.step-icon{
  width:92px;height:92px; margin:0 auto 20px;
  background:#fff; border:2px solid var(--line); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 18px rgba(35,43,54,.08);
}
.step-num{
  font-family:'Fraunces',serif; font-style:italic; color:var(--rust);
  font-size:14px; display:block; margin-bottom:8px;
}
.step h3{font-size:19px; margin-bottom:8px;}
.step p{color:var(--ink-soft); font-size:16px; margin:0;}
@media (max-width:880px){
  .route-line{display:none;}
  .route-steps{grid-template-columns:1fr 1fr; gap:36px 20px;}
}

.testimonial-wrap{
  background:var(--teal); color:#fff; border-radius:20px;
  padding:56px; position:relative; overflow:hidden;
}
.testimonial-wrap::before{
  content:"“"; position:absolute; top:-10px; left:24px;
  font-family:'Fraunces',serif; font-size:180px; color:rgba(255,255,255,.12);
  line-height:1;
}
.testimonial-wrap blockquote{
  font-family:'Fraunces',serif; font-style:italic; font-weight:500;
  font-size:clamp(22px,2.6vw,30px); margin:0 0 24px; max-width:60ch; position:relative;
}
.testimonial-wrap figcaption{font-family:'Inter'; font-weight:600; opacity:.9;}
.testimonial-note{font-size:14px; opacity:.7; margin-top:6px;}

.team-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:28px;}
.team-card{text-align:center;}
.avatar{
  width:120px;height:120px;border-radius:50%;margin:0 auto 16px;
  background:var(--paper-deep); border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
}
.team-card h3{font-size:18px; margin-bottom:4px;}
.team-card p{color:var(--ink-soft); font-size:15px; margin:0;}
@media (max-width:780px){ .team-grid{grid-template-columns:1fr;} }

.about-cta{
  text-align:center; background:var(--paper-deep); border-radius:20px; padding:56px 32px;
}
.about-cta h2{font-size:clamp(24px,3vw,32px); margin-bottom:14px;}
.about-cta p{color:var(--ink-soft); margin-bottom:26px;}

footer.site{
  background:var(--ink); color:#EDE6D6; padding:56px 0 28px; margin-top:20px;
}
.footer-top{
  display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:40px;
  padding-bottom:36px; border-bottom:1px solid rgba(255,255,255,.12);
}
.footer-logo{display:flex;align-items:center;gap:10px; font-family:'Fraunces',serif; font-size:20px; margin-bottom:14px;}
.footer-logo .logo-mark{width:32px;height:32px; filter:brightness(0) invert(1) opacity(.9);}
footer h4{font-family:'Inter'; font-size:15px; letter-spacing:.04em; text-transform:uppercase; color:#C9BFA3; margin:0 0 16px;}
footer p, footer a{color:#D8D0BC; font-size:15px; text-decoration:none; line-height:1.9;}
footer a:hover{color:#fff;}
.footer-bottom{
  display:flex; justify-content:space-between; align-items:center;
  padding-top:22px; font-size:13px; color:#9A917B; flex-wrap:wrap; gap:12px;
}
@media (max-width:780px){ .footer-top{grid-template-columns:1fr;} }

[data-reveal]{opacity:0; transform:translateY(16px); transition:opacity .6s ease, transform .6s ease;}
[data-reveal].is-visible{opacity:1; transform:translateY(0);}

/* ===================================================
   DASHBOARD (shared — youth + senior)
=================================================== */
.dash-shell{max-width:760px; margin:0 auto; padding:40px 28px 72px;}
.dash-greeting{margin-bottom:28px;}
.dash-greeting h1{font-size:clamp(24px,3vw,32px);}
.dash-greeting p{color:var(--ink-soft); margin-top:8px;}
.dash-card{
  background:#fff; border:1px solid var(--line); border-radius:18px;
  padding:28px 30px; margin-bottom:22px;
}
.dash-card h2{font-size:19px; margin-bottom:6px; display:flex; align-items:center; gap:10px;}
.dash-card p{color:var(--ink-soft); font-size:15px; margin:0;}
.dash-card.locked{background:var(--paper-deep); border-style:dashed;}
.lock-icon{
  width:34px;height:34px;border-radius:50%;background:#fff;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center; flex-shrink:0;
}
.status-badge{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700;
  padding:5px 12px; border-radius:999px; margin-bottom:14px;
}
.status-badge.pending{background:#F6E9D4; color:#9A6A1F;}
.status-badge.verified{background:#E1F0EA; color:var(--teal-deep);}
.status-badge.matched{background:#FBE4DC; color:var(--rust);}
.demo-toggle{
  margin-top:16px; font-size:13px; color:var(--ink-soft);
  background:none; border:1px dashed var(--line); border-radius:8px;
  padding:8px 12px; cursor:pointer;
}
.demo-toggle:hover{border-color:var(--teal); color:var(--teal);}
.hidden{display:none !important;}

.avail-grid{
  display:grid; grid-template-columns:90px repeat(7,1fr); gap:4px; margin-top:16px; font-size:13px;
}
.avail-grid .head{font-weight:700; text-align:center; padding:6px 2px; color:var(--ink-soft);}
.avail-grid .rowlabel{font-weight:600; display:flex; align-items:center; color:var(--ink-soft);}
.avail-cell{
  aspect-ratio:1.3; border-radius:6px; background:var(--paper-deep);
  border:1.5px solid var(--line); cursor:pointer;
}
.avail-cell.selected{background:var(--teal); border-color:var(--teal);}

.match-card{display:flex; gap:16px; align-items:center;}
.match-avatar{
  width:56px;height:56px;border-radius:50%; background:var(--paper-deep); border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.match-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
.match-tags span{
  font-size:12px; font-weight:600; background:var(--paper-deep); padding:4px 10px; border-radius:999px; color:var(--ink-soft);
}

/* ===================================================
   CALENDAR-STYLE BOOKING (senior view of youth availability)
=================================================== */
.cal-grid{
  display:grid; grid-template-columns:70px repeat(7,1fr); gap:4px; margin-top:16px; font-size:13px;
}
.cal-grid .head{font-weight:700; text-align:center; padding:6px 2px; color:var(--ink-soft);}
.cal-grid .rowlabel{font-weight:600; display:flex; align-items:center; color:var(--ink-soft); font-size:12px;}
.cal-cell{
  aspect-ratio:1.3; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; cursor:default;
}
.cal-cell.open{background:#E1F0EA; border:1.5px solid var(--teal); color:var(--teal-deep); cursor:pointer; font-weight:600;}
.cal-cell.open:hover{background:var(--teal); color:#fff;}
.cal-cell.open.selected{background:var(--rust); border-color:var(--rust); color:#fff;}
.cal-cell.taken{background:var(--paper-deep); color:#B7AD91;}

/* ===================================================
   MESSAGING + VIDEO CALL
=================================================== */
.chat-shell{max-width:720px; margin:0 auto; padding:32px 28px 60px;}
.chat-header{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  background:#fff; border:1px solid var(--line); border-radius:16px 16px 0 0; padding:18px 24px;
}
.chat-header-info{display:flex; align-items:center; gap:12px;}
.chat-box{
  border:1px solid var(--line); border-top:none; background:#fff; min-height:360px;
  padding:24px; display:flex; flex-direction:column; gap:14px;
}
.msg{max-width:70%; padding:12px 16px; border-radius:16px; font-size:15px; line-height:1.5;}
.msg.them{background:var(--paper-deep); align-self:flex-start; border-bottom-left-radius:4px;}
.msg.me{background:var(--teal); color:#fff; align-self:flex-end; border-bottom-right-radius:4px;}
.chat-input-row{
  display:flex; gap:10px; border:1px solid var(--line); border-top:none;
  border-radius:0 0 16px 16px; padding:14px; background:#fff;
}
.chat-input-row input{
  flex:1; border:1.5px solid var(--line); border-radius:999px; padding:12px 18px; font-family:'Inter'; font-size:15px;
}
.icon-btn{
  width:44px;height:44px;border-radius:50%; border:1.5px solid var(--line); background:#fff;
  display:flex;align-items:center;justify-content:center; cursor:pointer;
}
.icon-btn:hover{border-color:var(--teal);}

.call-overlay{
  position:fixed; inset:0; background:#12181f; z-index:200;
  display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff;
}
.call-stage{
  width:min(720px,90vw); aspect-ratio:16/10; background:#1E2733; border-radius:20px;
  position:relative; display:flex; align-items:center; justify-content:center;
  border:1px solid rgba(255,255,255,.08);
}
.call-self{
  position:absolute; bottom:18px; right:18px; width:120px; aspect-ratio:4/3;
  background:#2A3542; border-radius:12px; border:1px solid rgba(255,255,255,.15);
  display:flex; align-items:center; justify-content:center;
}
.call-name{position:absolute; top:18px; left:18px; font-size:14px; font-weight:600; opacity:.85;}
.call-controls{display:flex; gap:16px; margin-top:26px;}
.call-btn{
  width:56px;height:56px;border-radius:50%; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.12); color:#fff;
}
.call-btn.end{background:var(--rust);}
.call-btn:hover{background:rgba(255,255,255,.22);}
.call-btn.end:hover{background:#8f3a24;}

</style>
